    redirect to raw.githubusercontent.com; a fragment reference is resolved
    against the README page and the browser drops the whole image.
    HCT proxy (CIE L* at OKLab hue). Primary indigo 258, counter persimmon 16.
      indigo    T87 #CEDBEE  T67 #70A4F3  T17 #0E2951
      persimmon T87 #EED4D4  T67 #F4818A  T17 #4C181E
    Wordmark and icon strokes use indigo T17. The plus uses persimmon L* 42 #A04650
    (5.4:1 on the paper). Tone 67 indigo is a divider bar only.
    Hero copy is English only.
  -->
